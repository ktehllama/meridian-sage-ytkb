<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="32" height="32">
  <defs>
    <radialGradient id="g" cx="12" cy="12" r="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#6570fc"/>
    </radialGradient>
  </defs>
  <!-- Dark background circle -->
  <circle cx="12" cy="12" r="11.5" fill="#0a0a0f"/>
  <!-- Center dot -->
  <circle cx="12" cy="12" r="1.5" fill="url(#g)"/>
  <!-- Cardinal spokes N S E W -->
  <line x1="12" y1="12" x2="12" y2="3.5"  stroke="url(#g)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="12" y1="12" x2="12" y2="20.5" stroke="url(#g)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="12" y1="12" x2="20.5" y2="12" stroke="url(#g)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="12" y1="12" x2="3.5"  y2="12" stroke="url(#g)" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Diagonal spokes NE SE SW NW -->
  <line x1="12" y1="12" x2="17" y2="7"  stroke="url(#g)" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="12" y1="12" x2="17" y2="17" stroke="url(#g)" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="12" y1="12" x2="7"  y2="17" stroke="url(#g)" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="12" y1="12" x2="7"  y2="7"  stroke="url(#g)" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Crossbars on cardinal spokes -->
  <line x1="10" y1="6.5"  x2="14" y2="6.5"  stroke="url(#g)" stroke-width="1" stroke-linecap="round"/>
  <line x1="10" y1="17.5" x2="14" y2="17.5" stroke="url(#g)" stroke-width="1" stroke-linecap="round"/>
  <line x1="17.5" y1="10" x2="17.5" y2="14" stroke="url(#g)" stroke-width="1" stroke-linecap="round"/>
  <line x1="6.5"  y1="10" x2="6.5"  y2="14" stroke="url(#g)" stroke-width="1" stroke-linecap="round"/>
</svg>
